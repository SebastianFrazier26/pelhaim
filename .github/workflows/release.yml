name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo build --release -p pelhaim --target ${{ matrix.target }}
      - name: Package
        run: |
          name="pelhaim-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/pelhaim" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: pelhaim-${{ matrix.target }}
          path: pelhaim-*.tar.gz

  # Draft only: publishing a release is the owner's call.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes dist/*.tar.gz
