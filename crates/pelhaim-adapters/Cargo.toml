[package]
name = "pelhaim-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
notify = "9.0.0"
pelhaim-core = { path = "../pelhaim-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
