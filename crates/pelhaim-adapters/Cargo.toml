[package]
name = "pelhaim-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
notify = "9.0.0"
pelhaim-core = { path = "../pelhaim-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
