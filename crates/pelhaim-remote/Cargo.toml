[package]
name = "pelhaim-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pelhaim-core = { path = "../pelhaim-core" }
serde = { version = "1.0.229", features = ["derive"] }
