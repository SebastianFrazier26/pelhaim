[package]
name = "pelhaim"
description = "A subway-style track board for watching AI coding agent sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
arboard = { version = "3.7.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.9", features = ["derive"] }
pelhaim-adapters = { path = "../pelhaim-adapters" }
pelhaim-board = { path = "../pelhaim-board" }
pelhaim-core = { path = "../pelhaim-core" }
pelhaim-gpu = { path = "../pelhaim-gpu" }
pelhaim-remote = { path = "../pelhaim-remote" }
pelhaim-store = { path = "../pelhaim-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "process", "rt-multi-thread"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
pelhaim-core = { path = "../pelhaim-core", features = ["testkit"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
